# ==============================================================
# Perfil alternativo: PostgreSQL
# Para usar: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# (ajuste host/porta/usuario/senha/banco conforme seu ambiente)
# ==============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/petcare_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console nao se aplica nesse perfil
spring.h2.console.enabled=false
