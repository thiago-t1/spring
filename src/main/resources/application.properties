# ==============================================================
# PetCare Digital Solutions - Clinica Veterinaria
# Configuracao padrao: H2 em arquivo (nao precisa instalar nada)
# ==============================================================

spring.application.name=clinica

# ---- Banco de dados H2 (arquivo local em ./data/petcare) ----
spring.datasource.url=jdbc:h2:file:./data/petcare;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Jackson ----
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

server.port=8080

# Para usar PostgreSQL, rode com: --spring.profiles.active=postgres
# (ver application-postgres.properties)
